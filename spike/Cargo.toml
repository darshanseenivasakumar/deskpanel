[package]
name = "deskpanel-spike"
version = "0.0.1"
edition = "2021"
default-run = "spike"
# THROWAWAY: Stage 1 spike. Proves z-order strategy, logs shell window classes, probes RAM + Radios.

[[bin]]
name = "spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
png = "0.17"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_System_WinRT",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
] }
