[package]
name = "dpprobe"
version = "0.1.0"
edition = "2021"
description = "Test probe for DeskPanel: hit-testing, screenshots, synthetic input (used to produce CHECKLIST evidence)."

[dependencies]
png = "0.17"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Storage_Xps",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
